name: Android tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_UDID: emulator-5554
      APPIUM_PLATFORM_VERSION: "15"
      APPIUM_SERVER_URL: http://127.0.0.1:4723
      APPIUM_COMMAND_TIMEOUT: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Appium and UiAutomator2
        run: |
          npm install --global appium@3.8.0
          appium driver install uiautomator2@8.7.0

      - name: Prepare APK
        run: python scripts/download_demo_app.py

      - name: Run Android emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_PATH: ${{ github.workspace }}/demo_app/mda-2.3.0-27.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_9_pro
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p artifacts reports
            adb wait-for-device
            for attempt in $(seq 1 60); do
              if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            appium --address 127.0.0.1 --port 4723 > artifacts/appium.log 2>&1 &
            APPIUM_PID=$!
            trap 'kill "$APPIUM_PID" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:4723/status > artifacts/appium-status.json; then
                break
              fi
              sleep 2
            done
            curl --fail --silent http://127.0.0.1:4723/status > artifacts/appium-status.json
            python -m pytest -q --html=reports/pytest.html --self-contained-html --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualivanta-test-reports
          path: reports/
          if-no-files-found: warn

      - name: Upload diagnostics and Appium logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualivanta-runtime-artifacts
          path: artifacts/
          if-no-files-found: warn
